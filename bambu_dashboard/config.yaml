name: Bambu Dashboard
version: "1.2.0"
slug: bambu_dashboard
description: Dashboard AMS Bambu Lab — suivi de bobines et KPIs
url: https://github.com/coom/BambuBoard
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
ports:
  8000/tcp: 8000
panel_icon: mdi:printer-3d-nozzle
panel_title: Bambu
map:
  - share:rw
options:
  printer_ip: ""
  printer_serial: ""
  printer_access_code: ""
  nfc_api_key: ""
  # language: 'auto' cote backend = francais (messages d'erreur API).
  # Le frontend detecte independamment la langue du navigateur via localStorage.
  language: auto
schema:
  printer_ip: str
  printer_serial: str
  printer_access_code: password
  nfc_api_key: str?
  language: "list(auto|fr|en)?"
